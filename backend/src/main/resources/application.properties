spring.application.name=medicine-safety-checker-backend

# Load the ignored .env when launched from the repository root or backend/.
spring.config.import=optional:file:./.env[.properties],optional:file:../.env[.properties]

# MongoDB connection string is read from the MONGODB_URI environment variable.
# Never put real credentials in this file. For local overrides, create
# application-local.properties (git-ignored) and run with --spring.profiles.active=local
spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/medicine_safety_checker}
spring.data.mongodb.database=${MONGODB_DATABASE:medicine_safety_checker}

# Turn off demo data writes when connecting to an existing shared dataset.
app.seed.enabled=${APP_SEED_ENABLED:true}

# Browser sessions expire after 30 minutes of inactivity.
server.servlet.session.timeout=30m
server.servlet.session.tracking-modes=cookie
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
