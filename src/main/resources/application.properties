spring.application.name=medicine-safety-checker
spring.main.web-application-type=none

# MongoDB connection string is read from the MONGODB_URI environment variable.
# Never put real credentials in this file. For local overrides, create
# application-local.properties (git-ignored) and run with --spring.profiles.active=local
spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/medicine_safety_checker}
